openapi: 3.1.0
info:
  title: AegisOps AI
  description: AI-powered autonomous SRE platform with anomaly detection, incident
    investigation, and human-approved remediation.
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/health:
    get:
      summary: Health Check
      operationId: health_check_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/register:
    post:
      tags:
      - Authentication
      summary: Register
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/me:
    get:
      tags:
      - Authentication
      summary: Get Me
      operationId: get_me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - HTTPBearer: []
  /api/telemetry/summary:
    get:
      tags:
      - Telemetry & Observability
      summary: Get Telemetry Summary
      operationId: get_telemetry_summary_api_telemetry_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySummary'
  /api/telemetry/metrics:
    get:
      tags:
      - Telemetry & Observability
      summary: Get Dashboard Metrics
      description: Returns multi-metric time series formatted for Recharts line and
        area charts.
      operationId: get_dashboard_metrics_api_telemetry_metrics_get
      parameters:
      - name: time_window_minutes
        in: query
        required: false
        schema:
          type: integer
          default: 15
          title: Time Window Minutes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/telemetry/logs:
    get:
      tags:
      - Telemetry & Observability
      summary: Get Logs
      operationId: get_logs_api_telemetry_logs_get
      parameters:
      - name: service_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Name
      - name: level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
                title: Response Get Logs Api Telemetry Logs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/telemetry/time-travel:
    get:
      tags:
      - Telemetry & Observability
      summary: Get Time Travel Snapshot
      description: 'Replays infrastructure state at any point in time T - minutes_ago.

        Allows scrubbing through past telemetry and service health.'
      operationId: get_time_travel_snapshot_api_telemetry_time_travel_get
      parameters:
      - name: minutes_ago
        in: query
        required: false
        schema:
          type: integer
          maximum: 120
          minimum: 0
          default: 5
          title: Minutes Ago
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/telemetry/predictions:
    get:
      tags:
      - Telemetry & Observability
      summary: Get Incident Predictions
      operationId: get_incident_predictions_api_telemetry_predictions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PredictionResponse'
                type: array
                title: Response Get Incident Predictions Api Telemetry Predictions
                  Get
  /api/incidents:
    get:
      tags:
      - Incident Management
      summary: List Incidents
      operationId: list_incidents_api_incidents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response List Incidents Api Incidents Get
  /api/incidents/{incident_id}:
    get:
      tags:
      - Incident Management
      summary: Get Incident
      operationId: get_incident_api_incidents__incident_id__get
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Incident Api Incidents  Incident Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/incidents/{incident_id}/investigate:
    post:
      tags:
      - Incident Management
      summary: Investigate Incident
      description: Executes the full multi-agent investigation workflow.
      operationId: investigate_incident_api_incidents__incident_id__investigate_post
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/incidents/{incident_id}/remediation/approve:
    post:
      tags:
      - Incident Management
      summary: Approve Remediation
      description: Executes human-approved remediation in simulator, verifies recovery,
        and drafts postmortem.
      operationId: approve_remediation_api_incidents__incident_id__remediation_approve_post
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationApprovalRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/incidents/{incident_id}/postmortem:
    get:
      tags:
      - Incident Management
      summary: Get Postmortem
      operationId: get_postmortem_api_incidents__incident_id__postmortem_get
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/services:
    get:
      tags:
      - Services & Topology
      summary: List Services
      operationId: list_services_api_services_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response List Services Api Services Get
  /api/services/topology:
    get:
      tags:
      - Services & Topology
      summary: Get Topology
      operationId: get_topology_api_services_topology_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyResponse'
  /api/services/{name}:
    get:
      tags:
      - Services & Topology
      summary: Get Service
      operationId: get_service_api_services__name__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Service Api Services  Name  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/ai/copilot/chat:
    post:
      tags:
      - AI Copilot & Intelligence
      summary: Copilot Chat
      operationId: copilot_chat_api_ai_copilot_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/ai/copilot/nl2metrics:
    post:
      tags:
      - AI Copilot & Intelligence
      summary: Copilot Nl2Metrics
      description: Translates natural language questions to live Recharts time-series
        data.
      operationId: copilot_nl2metrics_api_ai_copilot_nl2metrics_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NLQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/ai/usage:
    get:
      tags:
      - AI Copilot & Intelligence
      summary: Get Ai Usage
      operationId: get_ai_usage_api_ai_usage_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/ai/calibration:
    get:
      tags:
      - AI Copilot & Intelligence
      summary: Get Ai Calibration
      description: "\u2B50 Standout Feature: AI Confidence Calibration Dashboard.\n\
        Measures reliability diagram and Brier score across agent predictions."
      operationId: get_ai_calibration_api_ai_calibration_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/simulations/status:
    get:
      tags:
      - Simulation & Fault Injection
      summary: Get Simulation Status
      operationId: get_simulation_status_api_simulations_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/simulations/traffic:
    post:
      tags:
      - Simulation & Fault Injection
      summary: Set Traffic
      operationId: set_traffic_api_simulations_traffic_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrafficRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/simulations/inject:
    post:
      tags:
      - Simulation & Fault Injection
      summary: Inject Scenario
      operationId: inject_scenario_api_simulations_inject_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjectScenarioRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/simulations/reset:
    post:
      tags:
      - Simulation & Fault Injection
      summary: Reset Simulation
      operationId: reset_simulation_api_simulations_reset_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/simulations/launch-demo:
    post:
      tags:
      - Simulation & Fault Injection
      summary: Launch Demo Incident
      description: 'Centerpiece one-click demo trigger:

        Injects a realistic database connection pool saturation failure on payment-service.'
      operationId: launch_demo_incident_api_simulations_launch_demo_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/knowledge:
    get:
      tags:
      - RAG Knowledge Base
      summary: List Knowledge Documents
      operationId: list_knowledge_documents_api_knowledge_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response List Knowledge Documents Api Knowledge Get
  /api/knowledge/upload:
    post:
      tags:
      - RAG Knowledge Base
      summary: Upload Knowledge Document
      operationId: upload_knowledge_document_api_knowledge_upload_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeUploadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/knowledge/search:
    post:
      tags:
      - RAG Knowledge Base
      summary: Search Knowledge
      operationId: search_knowledge_api_knowledge_search_post
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          title: Query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeSearchResult'
                title: Response Search Knowledge Api Knowledge Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/security/events:
    get:
      tags:
      - AI Security & Audit Trail
      summary: Get Security Events
      operationId: get_security_events_api_security_events_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/security/audit-logs:
    get:
      tags:
      - AI Security & Audit Trail
      summary: Get Audit Logs
      operationId: get_audit_logs_api_security_audit_logs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/evaluation/benchmarks:
    get:
      tags:
      - AI Evaluation Framework
      summary: Get Evaluations
      operationId: get_evaluations_api_evaluation_benchmarks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/evaluation/run:
    post:
      tags:
      - AI Evaluation Framework
      summary: Run Evaluation Suite
      operationId: run_evaluation_suite_api_evaluation_run_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /:
    get:
      tags:
      - Root
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ChatMessage:
      properties:
        role:
          type: string
          title: Role
        content:
          type: string
          title: Content
      type: object
      required:
      - role
      - content
      title: ChatMessage
    ChatRequest:
      properties:
        message:
          type: string
          title: Message
        conversation_history:
          items:
            $ref: '#/components/schemas/ChatMessage'
          type: array
          title: Conversation History
          default: []
        service_context:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Context
      type: object
      required:
      - message
      title: ChatRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InjectScenarioRequest:
      properties:
        scenario:
          type: string
          title: Scenario
        target_service:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Service
      type: object
      required:
      - scenario
      title: InjectScenarioRequest
    KnowledgeSearchResult:
      properties:
        document_id:
          type: integer
          title: Document Id
        title:
          type: string
          title: Title
        category:
          type: string
          title: Category
        chunk_content:
          type: string
          title: Chunk Content
        relevance_score:
          type: number
          title: Relevance Score
        source:
          type: string
          title: Source
      type: object
      required:
      - document_id
      - title
      - category
      - chunk_content
      - relevance_score
      - source
      title: KnowledgeSearchResult
    KnowledgeUploadRequest:
      properties:
        title:
          type: string
          title: Title
        category:
          type: string
          title: Category
          default: runbook
        content:
          type: string
          title: Content
        source:
          type: string
          title: Source
          default: manual_upload
      type: object
      required:
      - title
      - content
      title: KnowledgeUploadRequest
    LogEntry:
      properties:
        id:
          type: integer
          title: Id
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        service_name:
          type: string
          title: Service Name
        level:
          type: string
          title: Level
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
        message:
          type: string
          title: Message
        metadata_json:
          additionalProperties: true
          type: object
          title: Metadata Json
          default: {}
      type: object
      required:
      - id
      - timestamp
      - service_name
      - level
      - message
      title: LogEntry
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
    NLQueryRequest:
      properties:
        query:
          type: string
          title: Query
        service_filter:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Filter
      type: object
      required:
      - query
      title: NLQueryRequest
    PredictionResponse:
      properties:
        service_name:
          type: string
          title: Service Name
        probability:
          type: number
          title: Probability
        horizon_minutes:
          type: integer
          title: Horizon Minutes
          default: 30
        contributing_signals:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Contributing Signals
        risk_tier:
          type: string
          title: Risk Tier
        predicted_at:
          type: string
          format: date-time
          title: Predicted At
      type: object
      required:
      - service_name
      - probability
      - contributing_signals
      - risk_tier
      - predicted_at
      title: PredictionResponse
    RemediationApprovalRequest:
      properties:
        action_id:
          type: string
          title: Action Id
        approved:
          type: boolean
          title: Approved
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      required:
      - action_id
      - approved
      title: RemediationApprovalRequest
    TelemetrySummary:
      properties:
        system_health_score:
          type: number
          title: System Health Score
        overall_risk_score:
          type: number
          title: Overall Risk Score
        active_incidents_count:
          type: integer
          title: Active Incidents Count
        monitored_services_count:
          type: integer
          title: Monitored Services Count
        anomalies_detected_count:
          type: integer
          title: Anomalies Detected Count
        running_ai_investigations:
          type: integer
          title: Running Ai Investigations
        prediction_status:
          type: string
          title: Prediction Status
      type: object
      required:
      - system_health_score
      - overall_risk_score
      - active_incidents_count
      - monitored_services_count
      - anomalies_detected_count
      - running_ai_investigations
      - prediction_status
      title: TelemetrySummary
    Token:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        user:
          $ref: '#/components/schemas/UserResponse'
      type: object
      required:
      - access_token
      - user
      title: Token
    TopologyEdge:
      properties:
        source:
          type: string
          title: Source
        target:
          type: string
          title: Target
        traffic_volume:
          type: number
          title: Traffic Volume
        latency_ms:
          type: number
          title: Latency Ms
        status:
          type: string
          title: Status
      type: object
      required:
      - source
      - target
      - traffic_volume
      - latency_ms
      - status
      title: TopologyEdge
    TopologyNode:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        display_name:
          type: string
          title: Display Name
        health:
          type: string
          title: Health
        tier:
          type: string
          title: Tier
        latency_p95:
          type: number
          title: Latency P95
        error_rate:
          type: number
          title: Error Rate
        throughput:
          type: number
          title: Throughput
        cpu_percent:
          type: number
          title: Cpu Percent
        risk_score:
          type: number
          title: Risk Score
        is_impacted:
          type: boolean
          title: Is Impacted
          default: false
      type: object
      required:
      - id
      - name
      - display_name
      - health
      - tier
      - latency_p95
      - error_rate
      - throughput
      - cpu_percent
      - risk_score
      title: TopologyNode
    TopologyResponse:
      properties:
        nodes:
          items:
            $ref: '#/components/schemas/TopologyNode'
          type: array
          title: Nodes
        edges:
          items:
            $ref: '#/components/schemas/TopologyEdge'
          type: array
          title: Edges
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        active_incidents:
          type: integer
          title: Active Incidents
      type: object
      required:
      - nodes
      - edges
      - timestamp
      - active_incidents
      title: TopologyResponse
    TrafficRequest:
      properties:
        level:
          type: string
          title: Level
      type: object
      required:
      - level
      title: TrafficRequest
    UserCreate:
      properties:
        email:
          type: string
          format: email
          title: Email
        full_name:
          type: string
          title: Full Name
        role:
          $ref: '#/components/schemas/UserRole'
