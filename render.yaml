services:
  - type: web
    name: aegisops-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: aegisops-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
      - key: SECRET_KEY
        generateValue: true
      - key: USE_MOCK_LLM
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: ENABLE_AUTO_SIMULATION
        value: "true"

databases:
  - name: aegisops-postgres
    databaseName: aegisops
    user: aegisops_user
    region: oregon
    plan: free
